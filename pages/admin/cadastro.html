<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Criar acesso administrativo — NG Doce Duo</title>
  <meta name="description" content="Crie um acesso administrativo (modo demonstração) da NG Doce Duo." />
  <link rel="icon" href="../../assets/logo/ng-doce-duo-logo.png" />
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body data-no-layout style="background:var(--color-chocolate-dark);min-height:100vh;display:grid;place-items:center;padding:24px">
  <div style="width:100%;max-width:460px">
    <div class="text-center" style="margin-bottom:24px">
      <img src="../../assets/logo/ng-doce-duo-logo.png" alt="NG Doce Duo" width="72" height="72" style="border-radius:50%;background:var(--color-cream);margin:0 auto 12px" />
      <h1 style="color:var(--color-cream)">Acesso administrativo</h1>
    </div>
    <div class="form-card" data-root style="margin:0"></div>
  </div>

  <script src="../../js/include.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    window.NG_PAGE = {
      nav: "",
      init: function () {
        var root = NG.qs("[data-root]");
        if (NG.param("verify") && NG.authService.pendingAdminEmail()) { stepVerify(); return; }
        stepForm();

        function stepForm() {
          root.innerHTML =
            '<div class="form-card__head"><h2>Criar conta</h2><p>Ambiente de demonstração — nenhum e-mail real é enviado.</p></div>' +
            '<div data-alert></div>' +
            '<form data-form novalidate>' +
            '<div class="field"><label for="nome">Nome <span class="req">*</span></label><input id="nome" class="input" data-validate="required"></div>' +
            '<div class="field"><label for="email">E-mail <span class="req">*</span></label><input id="email" class="input" type="email" data-validate="required email"></div>' +
            '<div class="field"><label for="tel">Telefone</label><input id="tel" class="input" data-mask="phone"></div>' +
            '<div class="form-row"><div class="field"><label for="s1">Senha <span class="req">*</span></label><input id="s1" class="input" type="password" data-validate="required password"></div>' +
            '<div class="field"><label for="s2">Confirmar senha <span class="req">*</span></label><input id="s2" class="input" type="password" data-validate="required" data-match="#s1"></div></div>' +
            '<button class="btn btn--primary btn--block mt-4" type="submit" data-submit>Criar conta</button>' +
            '<p class="text-center text-small mt-6"><a class="link" href="login.html">Já tenho acesso</a></p></form>';
          var form = NG.qs("[data-form]");
          NG.validation.bindForm(form);
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            if (!NG.validation.validateForm(form)) return;
            var res = NG.authService.adminRegister({
              name: NG.qs("#nome").value, email: NG.qs("#email").value,
              phone: NG.qs("#tel").value, password: NG.qs("#s1").value,
            });
            if (!res.ok) { NG.qs("[data-alert]").innerHTML = danger(res.error); return; }
            stepVerify();
          });
        }

        function stepVerify() {
          var email = NG.authService.pendingAdminEmail();
          var pend = NG.storage.get("ng_admin_verify", null);
          render(pend ? pend.code : "");
          function render(code) {
            root.innerHTML =
              '<div class="form-card__head"><h2>Confirme o e-mail</h2><p>Enviamos um código para <strong>' + NG.escape(NG.maskEmail(email)) + "</strong>.</p></div>" +
              '<div class="alert alert--info">' + NG.icon("info", {}) + "<div>Modo demonstração: seu código é <strong>" + code + "</strong>.</div></div>" +
              '<div data-alert></div>' +
              '<div class="field"><span class="visually-hidden">Código</span><div data-otp></div></div>' +
              '<button class="btn btn--primary btn--block mt-4" data-confirm>Confirmar e ativar</button>' +
              '<p class="text-center text-small mt-6">Não recebeu? <button type="button" class="link" data-resend>Reenviar código</button></p>';
            var otp = NG.renderOTP(NG.qs("[data-otp]"), {});
            NG.qs("[data-confirm]").addEventListener("click", function () {
              var res = NG.authService.verifyAdminCode(otp.value());
              if (!res.ok) { NG.qs("[data-alert]").innerHTML = danger(res.error); return; }
              NG.toast({ type: "success", message: "E-mail confirmado! Já pode entrar." });
              location.href = "login.html";
            });
            NG.qs("[data-resend]").addEventListener("click", function () {
              var r = NG.authService.requestAdminCode(email);
              if (r.ok) { NG.toast({ type: "success", message: "Novo código enviado." }); render(r.code); }
            });
          }
        }

        function danger(msg) {
          return '<div class="alert alert--danger">' + NG.icon("alert", {}) + "<div>" + NG.escape(msg) + "</div></div>";
        }
      },
    };
  </script>
</body>
</html>
