<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirme seu e-mail — NG Doce Duo</title>
  <meta name="description" content="Confirme seu e-mail para ativar sua conta na NG Doce Duo." />
  <link rel="icon" href="../../assets/logo/ng-doce-duo-logo.png" />
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body>
  <div data-layout="header"></div>
  <main id="main" class="page-main">
    <div class="container">
      <div class="form-card" data-root></div>
    </div>
  </main>
  <div data-layout="footer"></div>

  <script src="../../js/include.js"></script>
  <script>
    window.NG_PAGE = {
      nav: "",
      init: function () {
        var root = NG.qs("[data-root]");
        var email = NG.authService.pendingEmail();
        if (!email) {
          root.innerHTML =
            '<div class="form-card__head"><h1>Nada para confirmar</h1><p>Não há confirmação de e-mail em andamento.</p></div>' +
            '<a class="btn btn--primary btn--block" href="cadastro.html">Criar conta</a>' +
            '<p class="text-center text-small mt-6"><a class="link" href="login.html">Voltar ao login</a></p>';
          return;
        }
        var pend = NG.storage.get("ng_email_verify", null);
        render(pend ? pend.code : "");

        function render(demoCode) {
          root.innerHTML =
            '<div class="form-card__head">' +
              '<div style="width:64px;height:64px;border-radius:50%;background:var(--color-rose-light);display:grid;place-items:center;margin:0 auto 12px;color:var(--color-chocolate)">' + NG.icon("info", { size: 32 }) + "</div>" +
              "<h1>Confira seu e-mail</h1>" +
              "<p>Enviamos um código de confirmação para <strong>" + NG.escape(NG.maskEmail(email)) + "</strong>. Digite os 8 dígitos abaixo.</p>" +
            "</div>" +
            '<div class="alert alert--info">' + NG.icon("info", {}) + "<div>Modo demonstração: nenhum e-mail real é enviado. Seu código é <strong>" + demoCode + "</strong>.</div></div>" +
            '<div data-alert></div>' +
            '<div class="field"><span class="visually-hidden">Código de 8 dígitos</span><div data-otp></div></div>' +
            '<button class="btn btn--primary btn--block mt-4" data-confirm>Confirmar e-mail</button>' +
            '<p class="text-center text-small mt-6">Não recebeu? <button type="button" class="link" data-resend>Reenviar código</button> · <a class="link" href="cadastro.html">Usar outro e-mail</a></p>';

          var otp = NG.renderOTP(NG.qs("[data-otp]"), {});
          NG.qs("[data-confirm]").addEventListener("click", function () {
            var res = NG.authService.verifyEmailCode(otp.value());
            if (!res.ok) {
              NG.qs("[data-alert]").innerHTML = '<div class="alert alert--danger">' + NG.icon("alert", {}) + "<div>" + NG.escape(res.error) + "</div></div>";
              return;
            }
            NG.toast({ type: "success", message: "E-mail confirmado! Conta ativada." });
            location.href = NG.url("pages/customer/perfil.html");
          });
          NG.qs("[data-resend]").addEventListener("click", function () {
            var r = NG.authService.requestEmailCode(email);
            if (r.ok) { NG.toast({ type: "success", message: "Novo código enviado." }); render(r.code); }
          });
        }
      },
    };
  </script>
</body>
</html>
