<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — NG Doce Duo</title>
  <meta name="description" content="Acesse sua conta NG Doce Duo." />
  <link rel="icon" href="../../assets/logo/ng-doce-duo-logo.png" />
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body>
  <div data-layout="header"></div>
  <main id="main" class="page-main">
    <div class="container">
      <form class="form-card" data-login-form novalidate>
        <div class="form-card__head">
          <h1>Bem-vindo de volta</h1>
          <p>Entre para acompanhar seus pedidos e comprar mais rápido.</p>
        </div>
        <div data-alert></div>
        <div class="field">
          <label for="email">E-mail <span class="req">*</span></label>
          <input id="email" class="input" type="email" data-validate="required email" autocomplete="email" placeholder="voce@email.com" />
        </div>
        <div class="field">
          <label for="senha">Senha <span class="req">*</span></label>
          <input id="senha" class="input" type="password" data-validate="required" autocomplete="current-password" placeholder="Sua senha" />
        </div>
        <div class="flex-between" style="margin-bottom:16px">
          <label class="check"><input type="checkbox" checked /> Lembrar de mim</label>
          <a class="link text-small" href="recuperar-senha.html">Esqueci minha senha</a>
        </div>
        <button class="btn btn--primary btn--block" type="submit" data-submit>Entrar</button>
        <p class="text-center text-small mt-6">Não tem conta? <a class="link" href="cadastro.html">Criar conta</a></p>
        <div class="alert alert--info mt-6"></div>
      </form>
    </div>
  </main>
  <div data-layout="footer"></div>

  <script src="../../js/include.js"></script>
  <script>
    window.NG_PAGE = {
      nav: "",
      init: function () {
        var form = NG.qs("[data-login-form]");
        NG.validation.bindForm(form);
        // dica de credenciais demo
        NG.qs(".alert.alert--info").innerHTML = NG.icon("info", {}) + "<div>Conta demo: <strong>marina@email.com</strong> / <strong>123456</strong></div>";
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!NG.validation.validateForm(form)) return;
          var btn = NG.qs("[data-submit]");
          btn.classList.add("is-loading");
          setTimeout(function () {
            var res = NG.authService.login(NG.qs("#email").value, NG.qs("#senha").value);
            btn.classList.remove("is-loading");
            if (!res.ok) {
              if (res.needVerify) {
                NG.toast({ message: "Confirme seu e-mail para continuar." });
                location.href = "verificar-email.html";
                return;
              }
              NG.qs("[data-alert]").innerHTML = '<div class="alert alert--danger">' + NG.icon("alert", {}) + "<div>" + res.error + "</div></div>";
              return;
            }
            NG.toast({ type: "success", message: "Bem-vinda, " + res.user.name.split(" ")[0] + "!" });
            var redirect = NG.param("redirect");
            location.href = redirect ? decodeURIComponent(redirect) : NG.url("pages/customer/perfil.html");
          }, 600);
        });
      },
    };
  </script>
</body>
</html>
