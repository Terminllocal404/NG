<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sua sacola — NG Doce Duo</title>
  <meta name="description" content="Revise os itens da sua sacola na NG Doce Duo." />
  <link rel="icon" href="../../assets/logo/ng-doce-duo-logo.png" />
  <link rel="stylesheet" href="../../css/main.css" />
</head>
<body>
  <div data-layout="header"></div>
  <main id="main" class="page-main">
    <div class="container section">
      <nav class="breadcrumb"><a href="../../index.html">Home</a><span class="sep">›</span><span aria-current="page">Sacola</span></nav>
      <h1 style="margin-bottom:24px">Sua sacola</h1>
      <div data-cart-root></div>
    </div>
  </main>
  <div data-layout="footer"></div>

  <script src="../../js/include.js"></script>
  <script>
    window.NG_PAGE = {
      nav: "",
      init: function () {
        var root = NG.qs("[data-cart-root]");
        var undoTimer = null;

        function render() {
          var items = NG.cart.items();
          if (!items.length) {
            root.innerHTML = renderEmpty();
            loadSuggestions();
            return;
          }
          root.innerHTML =
            '<div class="split--checkout">' +
              '<div class="card card--flat" data-items></div>' +
              renderSummary() +
            "</div>";
          NG.qs("[data-items]").innerHTML = items.map(renderItem).join("");
          wire();
        }

        function renderEmpty() {
          return (
            NG.emptyState({
              icon: "cart",
              title: "Sua sacola está vazia",
              message: "Que tal adoçar o dia? Escolha seus doces favoritos e eles aparecem aqui.",
              actionHtml: '<a class="btn btn--primary btn--inline" href="../catalogo.html">Ver catálogo</a>',
            }) +
            '<div class="section"><div class="section-head"><h2>Sugestões para você</h2></div><div class="grid grid-products" data-suggestions></div></div>'
          );
        }

        function renderItem(i) {
          var p = NG.getProduct(i.id);
          return (
            '<div class="cart-item" data-item="' + i.id + '">' +
              '<img class="cart-item__img" src="' + NG.url(i.image) + '" alt="' + NG.escape(i.name) + '">' +
              "<div>" +
                '<div class="cart-item__name">' + NG.escape(i.name) + "</div>" +
                '<div class="cart-item__meta">' + (p ? NG.categoryName(p.category) : "") + " · " + NG.money(i.price) + " un.</div>" +
                '<button class="btn btn--ghost btn--sm btn--inline" data-remove="' + i.id + '" style="padding-left:0;margin-top:4px;color:var(--color-danger)">' + NG.icon("trash", { size: 16 }) + " Remover</button>" +
              "</div>" +
              '<div class="cart-item__actions">' +
                '<div class="qty"><button data-dec="' + i.id + '" aria-label="Diminuir">' + NG.icon("minus", { size: 18 }) + "</button>" +
                '<input type="text" value="' + i.qty + '" data-qtyval="' + i.id + '" readonly aria-label="Quantidade de ' + NG.escape(i.name) + '">' +
                '<button data-inc="' + i.id + '" aria-label="Aumentar">' + NG.icon("plus", { size: 18 }) + "</button></div>" +
                '<span class="cart-item__price">' + NG.money(i.price * i.qty) + "</span>" +
              "</div>" +
            "</div>"
          );
        }

        function renderSummary() {
          var sub = NG.cart.subtotal();
          var disc = NG.cart.discount();
          var coupon = NG.cart.coupon();
          var cRes = NG.cart.couponResult();
          var couponBlock;
          if (coupon && cRes && cRes.ok) {
            couponBlock = '<div class="alert alert--success">' + NG.icon("tag", {}) + "<div>Cupom <strong>" + coupon.code + "</strong> aplicado. <button class=\"link\" data-remove-coupon type=\"button\">Remover</button></div></div>";
          } else if (coupon && cRes && !cRes.ok) {
            couponBlock = '<div class="alert alert--warning">' + NG.icon("alert", {}) + "<div>" + NG.escape(cRes.error) + " <button class=\"link\" data-remove-coupon type=\"button\">Remover cupom</button></div></div>";
          } else {
            couponBlock = '<form data-coupon-form class="flex" style="gap:8px"><input class="input" placeholder="Cupom de desconto" data-coupon aria-label="Cupom"><button class="btn btn--secondary btn--inline" type="submit">Aplicar</button></form>';
          }
          return (
            '<aside class="card order-summary" style="position:sticky;top:calc(var(--header-h) + 16px)">' +
              "<h3>Resumo do pedido</h3><div class=\"divider\"></div>" +
              '<div class="summary-row"><span class="muted">Subtotal</span><span>' + NG.money(sub) + "</span></div>" +
              (disc > 0 ? '<div class="summary-row"><span class="muted">Desconto (' + coupon.code + ")</span><span class=\"discount\">- " + NG.money(disc) + "</span></div>" : "") +
              '<div class="summary-row"><span class="muted">Entrega</span><span>Calculada no checkout</span></div>' +
              '<div class="summary-row summary-row--total"><span>Total</span><span>' + NG.money(sub - disc) + "</span></div>" +
              '<div class="mt-6">' + couponBlock + "</div>" +
              '<a class="btn btn--primary btn--block mt-6" href="checkout.html">Finalizar pedido</a>' +
              '<a class="btn btn--ghost btn--block mt-4" href="../catalogo.html">Continuar comprando</a>' +
              '<p class="text-small text-soft mt-4">Cupons de teste: <strong>DOCE10</strong> e <strong>BEMVINDO</strong>.</p>' +
            "</aside>"
          );
        }

        function wire() {
          root.addEventListener("click", onClick);
          var cf = NG.qs("[data-coupon-form]");
          if (cf) cf.addEventListener("submit", function (e) {
            e.preventDefault();
            var res = NG.cart.applyCoupon(NG.qs("[data-coupon]").value);
            if (res.ok) { NG.toast({ type: "success", message: "Cupom aplicado com sucesso!" }); render(); }
            else NG.toast({ type: "danger", message: res.error });
          });
        }

        function onClick(e) {
          var inc = e.target.closest("[data-inc]");
          var dec = e.target.closest("[data-dec]");
          var rem = e.target.closest("[data-remove]");
          var rc = e.target.closest("[data-remove-coupon]");
          if (inc) { NG.cart.setQty(inc.dataset.inc, getQty(inc.dataset.inc) + 1); render(); }
          else if (dec) { NG.cart.setQty(dec.dataset.dec, getQty(dec.dataset.dec) - 1); render(); }
          else if (rem) { doRemove(rem.dataset.remove); }
          else if (rc) { NG.cart.removeCoupon(); render(); }
        }
        function getQty(id) {
          var it = NG.cart.items().find(function (x) { return x.id === id; });
          return it ? it.qty : 1;
        }

        function doRemove(id) {
          var removed = NG.cart.remove(id);
          render();
          if (!removed) return;
          var t = NG.toast({
            title: "Item removido",
            message: removed.name,
            actionLabel: "Desfazer",
            duration: 8000,
            onAction: function () { NG.cart.restore(removed); render(); },
          });
        }

        function loadSuggestions() {
          NG.productService.featured().then(function (items) {
            var el = NG.qs("[data-suggestions]");
            if (el) el.innerHTML = items.slice(0, 4).map(NG.productCard).join("");
          });
        }

        render();
      },
    };
  </script>
</body>
</html>
